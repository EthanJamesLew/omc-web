<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>omc-web · OpenModelica in WebAssembly</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <!-- omc.js's first line is `var Module = typeof Module != "undefined" ? Module : {};`
       so we install our Module object BEFORE that script tag runs.
       Note: emscripten captures Module["print"]/Module["printErr"] into local vars
       at init time (`var out = Module["print"] || console.log`). Replacing those
       references later is ineffective. Instead, the print/printErr functions read
       window.__omcweb.sink on EACH call — pipeline.js just swaps the sink pointer
       per stage so we can attribute output to the right pipeline phase. -->
  <script>
    window.__omcweb = { out: [], ready: false, err: null, sink: null };
    window.Module = {
      noInitialRun: true,
      print: (t) => {
        if (window.__omcweb.sink) window.__omcweb.sink("info", t);
        else window.__omcweb.out.push(t + "\n");
      },
      printErr: (t) => {
        if (window.__omcweb.sink) window.__omcweb.sink("err", t);
        else window.__omcweb.out.push("[err] " + t + "\n");
      },
      onRuntimeInitialized: () => {
        window.__omcweb.ready = true;
        if (window.__omcweb.onReady) window.__omcweb.onReady();
      },
      onAbort: (w) => { window.__omcweb.err = String(w); },
    };
  </script>

  <!-- Vendor libs (CDN). For production these would be bundled & pinned locally. -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- OMC compiler runtime (~21 MB wasm + .data). Loads asynchronously. -->
  <script src="omc.js"></script>

  <!-- Default Modelica source + a tiny syntax highlighter. -->
  <script src="modelica-source.js"></script>

  <!-- Version info (regenerated by scripts/gen-version.sh on every serve). -->
  <script src="version.js"></script>

  <!-- Pipeline module (ES module — imports Comlink). Exposes window.OMCPipeline. -->
  <script type="module" src="pipeline.js"></script>

  <!-- React app (Babel-transformed JSX). -->
  <script type="text/babel" src="playground.jsx"></script>
</head>
<body class="mp-theme-light">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    function useMediaQuery(query) {
      const [matches, setMatches] = React.useState(() =>
        typeof window !== "undefined" && window.matchMedia(query).matches);
      React.useEffect(() => {
        const m = window.matchMedia(query);
        const handler = (e) => setMatches(e.matches);
        m.addEventListener("change", handler);
        setMatches(m.matches);
        return () => m.removeEventListener("change", handler);
      }, [query]);
      return matches;
    }

    function ResponsiveApp() {
      const isMobile = useMediaQuery("(max-width: 820px)");
      React.useEffect(() => {
        document.body.classList.toggle("is-mobile", isMobile);
      }, [isMobile]);
      return <window.PlaygroundApp layout={isMobile ? "mobile" : "workbench"} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ResponsiveApp />);
  </script>
</body>
</html>
